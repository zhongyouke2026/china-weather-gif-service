[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "china-weather-gif-pipeline"
version = "1.0.0"
description = "NOAA GFS + QWeather seven-day China and Taiwan weather GIF pipeline"
requires-python = ">=3.11"
dependencies = [
  "cartopy>=0.24,<0.26",
  "eccodes>=2.35,<3",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "Pillow>=11,<13",
  "python-dateutil>=2.9,<3",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
china-weather = "weather_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["weather_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
